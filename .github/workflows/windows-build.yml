name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Device identity core tests
        run: ./tests/run-device-identity-tests.sh

  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x86, x64]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build solution
        shell: pwsh
        run: >-
          msbuild 2Box.sln /t:Build /m:1
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}
          /verbosity:minimal

      - name: Check packaged branding strings
        if: matrix.configuration == 'Release' && matrix.platform == 'x64'
        shell: pwsh
        run: |
          $files = @(
            (Join-Path $env:GITHUB_WORKSPACE 'bin\x64\WorkspaceHost.exe'),
            (Join-Path $env:GITHUB_WORKSPACE 'bin\x64\WorkspaceCli.exe')
          )
          $files += @(Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE '2Box\res\embed_dll') -Filter '*.dll' -Recurse |
            Select-Object -ExpandProperty FullName)
          foreach ($file in $files) {
            $content = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($file))
            if ($content -match '(?i)2box' -or $content -match '2\x00[bB]\x00[oO]\x00[xX]\x00') {
              throw "Legacy branding found in packaged binary: $file"
            }
          }

      - name: Probe managed device queries
        if: matrix.configuration == 'Release' && matrix.platform == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'tests\windows-device-probe.ps1'
          $check = Join-Path $env:GITHUB_WORKSPACE 'tests\check-windows-device-probe.ps1'
          $scopeSmoke = Join-Path $env:GITHUB_WORKSPACE 'tests\windows-hook-scope-smoke.ps1'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'bin\x64\WorkspaceCli.exe'
          $powershell = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $baseline = Join-Path $env:RUNNER_TEMP 'device-probe-baseline.json'
          $managedA = Join-Path $env:RUNNER_TEMP 'device-probe-managed-a.json'
          $managedB = Join-Path $env:RUNNER_TEMP 'device-probe-managed-b.json'
          $scopeResult = Join-Path $env:RUNNER_TEMP 'device-probe-hook-scope.json'
          $nativeAssembly = Join-Path $env:RUNNER_TEMP 'device-probe-native.dll'
          $env:WORKSPACE_DIAGNOSTIC_FILE = Join-Path $env:RUNNER_TEMP 'device-probe-injection.log'
          function Write-ScopeFailure([string]$detail) {
            $trace = if (Test-Path -LiteralPath $env:WORKSPACE_DIAGNOSTIC_FILE) {
              (Get-Content -LiteralPath $env:WORKSPACE_DIAGNOSTIC_FILE | Select-Object -Last 20) -join ' / '
            } else { 'no injection trace' }
            $appError = Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5); Level=2} -MaxEvents 1 -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Message
            $diagnostic = "$detail / $trace / $appError"
            if ($diagnostic.Length -gt 1400) { $diagnostic = $diagnostic.Substring(0, 1400) }
            $diagnostic = $diagnostic -replace '%','%25' -replace '\r','%0D' -replace '\n','%0A'
            Write-Output "::error title=Hook scope compiler child::$diagnostic"
          }
          function Write-ProbeFailure([string]$detail) {
            $reports = @($baseline, $managedA, $managedB) | ForEach-Object {
              if (Test-Path -LiteralPath $_) {
                $probe = Get-Content -LiteralPath $_ -Raw | ConvertFrom-Json
                $kind = {
                  param([string]$value)
                  if (!$value) { 'empty' }
                  elseif ($value -match '^(NO_|OPEN_ERROR|QUERY_ERROR|WAIT_ERROR|EVENT_ERROR|TIMEOUT)') { $value.Split(':')[0] }
                  else { 'present' }
                }
                $summary = [ordered]@{
                  File = [IO.Path]::GetFileName($_)
                  FatalError = [string]$probe.FatalError
                  WmiSerial = & $kind ([string]$probe.WmiSerial)
                  AsyncWmiSerial = & $kind ([string]$probe.AsyncWmiSerial)
                  WmiBiosSerial = & $kind ([string]$probe.WmiBiosSerial)
                  WmiProductUuid = & $kind ([string]$probe.WmiProductUuid)
                  WmiMac = & $kind ([string]$probe.WmiMac)
                  WmiAdapterGuid = & $kind ([string]$probe.WmiAdapterGuid)
                  StorageSerial = & $kind ([string]$probe.StorageSerial)
                  AsyncStorageSerial = & $kind ([string]$probe.AsyncStorageSerial)
                  ShortQuery = if ([string]$probe.ShortQuery -match '^SHORT_OK') { 'SHORT_OK' } else { 'other' }
                  InvalidWmiClassStatus = [string]$probe.InvalidWmiClassStatus
                }
                "$($_ | Split-Path -Leaf)=" + ($summary | ConvertTo-Json -Compress)
              }
            }
            $diagnostic = "$detail / " + ($reports -join ' / ')
            if ($diagnostic.Length -gt 1400) { $diagnostic = $diagnostic.Substring(0, 1400) }
            $diagnostic = $diagnostic -replace '%','%25' -replace '\r','%0D' -replace '\n','%0A'
            Write-Output "::error title=Device probe assertion::$diagnostic"
          }
          $env:WORKSPACE_HOOK_SCOPE = 'device-async'
          & $cli $powershell -NoProfile -ExecutionPolicy Bypass -File $scopeSmoke -Output $scopeResult
          $deadline = (Get-Date).AddSeconds(45)
          while (!(Test-Path -LiteralPath $scopeResult) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (!(Test-Path -LiteralPath $scopeResult)) {
            Write-ScopeFailure 'No result file after 45 seconds'
            throw 'Hook scope smoke did not finish'
          }
          $smoke = Get-Content -LiteralPath $scopeResult -Raw | ConvertFrom-Json
          if ($smoke.Scope -ne 'device-async') { throw 'Hook scope was not inherited by managed PowerShell' }
          if (!$smoke.CompilerChildSucceeded) {
            Write-ScopeFailure ([string]$smoke.FatalError)
            Write-Host $smoke.FatalError
            throw 'Hook scope compiler child failed'
          }
          Get-Process WorkspaceHost -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item Env:WORKSPACE_HOOK_SCOPE
          Start-Sleep -Seconds 1
          & $powershell -NoProfile -ExecutionPolicy Bypass -File $probe -Output $baseline -NativeAssembly $nativeAssembly
          if ($LASTEXITCODE -ne 0) {
            Write-ProbeFailure "Baseline probe failed: $LASTEXITCODE"
            throw "Baseline probe failed: $LASTEXITCODE"
          }
          $env:WORKSPACE_HOOK_SCOPE = 'device-async'
          foreach ($output in @($managedA, $managedB)) {
            & $cli $powershell -NoProfile -ExecutionPolicy Bypass -File $probe -Output $output -NativeAssembly $nativeAssembly
            $deadline = (Get-Date).AddSeconds(45)
            while (!(Test-Path -LiteralPath $output) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path -LiteralPath $output)) {
              Write-Host 'Injection stages:'
              if (Test-Path -LiteralPath $env:WORKSPACE_DIAGNOSTIC_FILE) {
                Get-Content -LiteralPath $env:WORKSPACE_DIAGNOSTIC_FILE
              } else {
                Write-Host '(no injected DLL trace)'
              }
              Write-Host 'Relevant processes:'
              Get-Process WorkspaceHost, powershell -ErrorAction SilentlyContinue |
                Select-Object ProcessName, Id, Responding, StartTime | Format-Table | Out-String | Write-Host
              Write-Host 'Recent application errors:'
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5); Level=2} -MaxEvents 5 -ErrorAction SilentlyContinue |
                Select-Object TimeCreated, ProviderName, Message | Format-List | Out-String | Write-Host
              Write-ProbeFailure "Managed probe did not finish: $output"
              throw "Managed probe did not finish: $output"
            }
          }
          Get-Process WorkspaceHost -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item Env:WORKSPACE_HOOK_SCOPE -ErrorAction SilentlyContinue
          try {
            & $check -Baseline $baseline -ManagedA $managedA -ManagedB $managedB
          } catch {
            Write-ProbeFailure $_.Exception.ToString()
            throw
          }

      - name: Probe default multi-instance mode (device simulation must stay off)
        if: matrix.configuration == 'Release' && matrix.platform == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'tests\windows-device-probe.ps1'
          $check = Join-Path $env:GITHUB_WORKSPACE 'tests\check-windows-default-mode.ps1'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'bin\x64\WorkspaceCli.exe'
          $powershell = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $baseline = Join-Path $env:RUNNER_TEMP 'device-probe-baseline.json'
          $managed = Join-Path $env:RUNNER_TEMP 'device-probe-default.json'
          $nativeAssembly = Join-Path $env:RUNNER_TEMP 'device-probe-native.dll'
          Remove-Item Env:WORKSPACE_HOOK_SCOPE -ErrorAction SilentlyContinue
          Get-Process WorkspaceHost -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          & $cli $powershell -NoProfile -ExecutionPolicy Bypass -File $probe -Output $managed -NativeAssembly $nativeAssembly
          $deadline = (Get-Date).AddSeconds(45)
          while (!(Test-Path -LiteralPath $managed) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          Get-Process WorkspaceHost -ErrorAction SilentlyContinue | Stop-Process -Force
          if (!(Test-Path -LiteralPath $managed)) { throw 'Default-mode probe did not finish' }
          & $check -Baseline $baseline -ManagedDefault $managed

      - name: Probe per-application device policy
        if: matrix.configuration == 'Release' && matrix.platform == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'tests\windows-device-probe.ps1'
          $check = Join-Path $env:GITHUB_WORKSPACE 'tests\check-windows-device-probe.ps1'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'bin\x64\WorkspaceCli.exe'
          $powershell = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $baseline = Join-Path $env:RUNNER_TEMP 'device-probe-baseline.json'
          $outputs = @((Join-Path $env:RUNNER_TEMP 'device-probe-policy-a.json'), (Join-Path $env:RUNNER_TEMP 'device-probe-policy-b.json'))
          $nativeAssembly = Join-Path $env:RUNNER_TEMP 'device-probe-native.dll'
          $dataDirectory = Join-Path $env:GITHUB_WORKSPACE 'bin\x64\Env\data'
          $policy = Join-Path $dataDirectory 'device-policy.ini'
          Remove-Item Env:WORKSPACE_HOOK_SCOPE -ErrorAction SilentlyContinue
          Get-Process WorkspaceHost -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          New-Item -ItemType Directory -Force -Path $dataDirectory | Out-Null
          Set-Content -LiteralPath $policy -Value @('[app]', 'match = powershell.exe', 'capabilities = storage, storage-async, network, smbios, os, wmi')
          try {
            foreach ($output in $outputs) {
              & $cli $powershell -NoProfile -ExecutionPolicy Bypass -File $probe -Output $output -NativeAssembly $nativeAssembly
              $deadline = (Get-Date).AddSeconds(45)
              while (!(Test-Path -LiteralPath $output) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
              if (!(Test-Path -LiteralPath $output)) { throw "Policy probe did not finish: $output" }
            }
          } finally {
            Remove-Item -LiteralPath $policy -ErrorAction SilentlyContinue
            Get-Process WorkspaceHost -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          & $check -Baseline $baseline -ManagedA $outputs[0] -ManagedB $outputs[1] -ExpectMachineGuid

      - name: Upload device probe results
        if: always() && matrix.configuration == 'Release' && matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: device-probe-results
          path: ${{ runner.temp }}\device-probe-*.json
          if-no-files-found: ignore

      - name: Upload injection trace
        if: always() && matrix.configuration == 'Release' && matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: device-probe-injection-trace
          path: ${{ runner.temp }}\device-probe-injection.log
          if-no-files-found: ignore
